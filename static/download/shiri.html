<!doctype html>
<html lang="zh-cn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拾日 · 下载</title>
<style>
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", sans-serif;
    max-width: 460px;
    margin: 48px auto;
    padding: 24px;
    text-align: center;
    color: #1a1a1a;
    background: #fbfaf6;
  }
  h1 { font-weight: normal; letter-spacing: 6px; font-size: 32px; margin-bottom: 4px; }
  .slogan { color: #9a9893; font-size: 13px; letter-spacing: 4px; margin-bottom: 48px; }
  .grid { display: grid; gap: 12px; }
  a.btn {
    display: block;
    padding: 14px 28px;
    background: #ffffff;
    color: #1a1a1a;
    text-decoration: none;
    border-radius: 14px;
    border: 1px solid #ecebe4;
    font-size: 15px;
    letter-spacing: 2px;
  }
  a.btn.primary {
    background: #1a1a1a;
    color: #fbfaf6;
    border-color: #1a1a1a;
  }
  a.btn.disabled { color: #c3c0b7; pointer-events: none; }
  .tip { color: #9a9893; font-size: 12px; margin-top: 32px; line-height: 1.7; }
</style>
</head>
<body>
  <h1>拾  日</h1>
  <div class="slogan">一 日 一 瓣</div>

  <div class="grid">
    <a class="btn" href="https://github.com/Fengur/Fengur.github.io/releases/download/shiri-v0.1.0/shiri-v0.1.0.apk" data-os="android">
      Android · 下载 APK
    </a>
    <a class="btn disabled" data-os="ios">iOS · 敬请期待</a>
    <a class="btn disabled" data-os="harmony">鸿蒙 · 敬请期待</a>
  </div>

  <p class="tip">
    下载 APK 后系统可能提示&ldquo;文件可能有害&rdquo;,点&ldquo;仍然保留&rdquo;即可安装。
  </p>

  <script>
    const ua = navigator.userAgent;
    const os = /HarmonyOS|OpenHarmony/.test(ua) ? 'harmony'
             : /Android/.test(ua) ? 'android'
             : /iPhone|iPad/.test(ua) ? 'ios'
             : null;
    if (os) document.querySelector(`[data-os="${os}"]`)?.classList.add('primary');
  </script>
</body>
</html>
